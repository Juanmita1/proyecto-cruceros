# Netlify: "Add new site" → importar el repositorio → Base directory: bagtags-pwa
[build]
  base = "bagtags-pwa"
  command = "npm ci && npm test && npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
